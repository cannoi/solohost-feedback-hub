<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoloHost Feedback Hub Connector sample</title><style>
:root{font:16px system-ui,sans-serif;color:#17243b;background:#f2f6fc}body{margin:0;background:radial-gradient(ellipse at 20% 0,#dcecff,transparent 44%),#f2f6fc}.wrap{max-width:720px;margin:6vh auto;padding:20px}.card{background:#ffffffdf;border:1px solid white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 16px 42px #294d7418}label{display:block;margin:12px 0 6px}input,textarea,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #ced9e8}input,textarea{width:100%;box-sizing:border-box}textarea{min-height:90px}button{background:#2563eb;color:#fff;border:0;cursor:pointer;margin-top:12px}.muted{color:#64748b}#message{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
</style><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body><main class="wrap"><h1>SoloHost Connector</h1><p class="muted">Runnable sample: feedback and Pi payments are sent through the sample backend; application credentials stay on the server.</p><section class="card"><h2>Send feedback</h2><form id="feedback"><label>Title<input name="title" required maxlength="160"></label><label>Message<textarea name="message" required maxlength="4000"></textarea></label><button>Submit feedback</button></form></section><section class="card"><h2>Pi payment (Pi Browser)</h2><label>Order reference<input id="order" value="sample-order-1"></label><button id="pay">Pay with Pi</button><p class="muted">Requires the matching Pi Developer App to be configured for this origin and the sample backend.</p></section><section id="message" class="card" role="status" aria-live="polite"></section></main><script>
const output=document.getElementById("message");async function call(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||j.code||`HTTP ${r.status}`);return j}
document.getElementById("feedback").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const result=await call("/feedback",{category:"general",title:f.get("title"),message:f.get("message"),anonymous:true});output.textContent=`Feedback received: ${result.feedback.id}${result.feedback.follow_up_token?`\nFollow-up token: ${result.feedback.follow_up_token}`:""}`}catch(x){output.textContent=x.message}};
document.getElementById("pay").onclick=async()=>{try{if(!window.Pi)throw Error("Open this page in a Pi-enabled environment.");Pi.init({version:"2.0",sandbox:true});const auth=await Pi.authenticate(["username","payments"],async incomplete=>{try{const result=await call("/payments/incomplete",{payment_id:incomplete.identifier,txid:incomplete.transaction?.txid});output.textContent=result.payment.verification_state==="verified"?"Previously interrupted payment completed and verified.":"Interrupted payment is awaiting authoritative completion."}catch(e){output.textContent=`Could not recover incomplete payment: ${e.message}`}});const order=document.getElementById("order").value;const created=await call("/payments/session",{order_reference:order});const s=created.session;Pi.createPayment({amount:s.amount,memo:s.memo,metadata:s.metadata},{onReadyForServerApproval:async paymentId=>{const r=await call(`/payments/${encodeURIComponent(s.session_id)}/approve`,{payment_id:paymentId,user_access_token:auth.accessToken});output.textContent=`Server approved payment ${paymentId}. Awaiting Pi transaction verification.`;return r},onReadyForServerCompletion:async(paymentId,txid)=>{const r=await call(`/payments/${encodeURIComponent(s.session_id)}/complete`,{payment_id:paymentId,txid});output.textContent=r.payment.status==="completed"&&r.payment.verification_state==="verified"?"Payment completed and verified by Pi Platform.":"Payment is still pending authoritative confirmation."},onCancel:()=>{output.textContent="Payment cancelled."},onError:error=>{output.textContent=`Pi payment error: ${error.message||"request failed"}`}})}catch(x){output.textContent=x.message}};
</script></body></html>
