<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Track feedback | Feedback Hub</title>
<style>
:root{font:16px system-ui,sans-serif;color:#17243b;background:#f2f6fc}body{margin:0;background:radial-gradient(ellipse at 20% 0,#dcecff,transparent 44%),#f2f6fc}.wrap{max-width:760px;margin:8vh auto;padding:20px}.card{background:#ffffffd9;border:1px solid white;border-radius:18px;padding:22px;box-shadow:0 16px 42px #294d7418;backdrop-filter:blur(12px)}h1{font-size:1.5rem}label{display:block;margin:12px 0 6px}input,textarea,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #ced9e8}input,textarea{width:100%;box-sizing:border-box}textarea{min-height:92px}button{background:#2563eb;color:#fff;border:0;cursor:pointer;margin-top:12px}.muted{color:#64748b}.item{border-top:1px solid #dce4ee;padding:14px 0;overflow-wrap:anywhere}.error{color:#a11}.status{display:inline-block;border-radius:999px;background:#e8eef8;padding:4px 10px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
</style></head><body><main class="wrap"><section class="card"><h1>Track your feedback</h1><p class="muted">Enter the private follow-up token shown when you submitted feedback. It grants access only to that submission.</p><form id="lookup"><label for="token">Follow-up token</label><input id="token" autocomplete="off" required maxlength="80" placeholder="fhcust_â€¦"><button>View feedback</button></form><p id="status" role="status" aria-live="polite"></p><section id="record" hidden></section></section></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let active=null,secret="";
async function api(id,path="",opts={}){const r=await fetch(`/api/v1/customer/feedback/${encodeURIComponent(id)}${path}`,{...opts,credentials:"omit",headers:{Authorization:`Bearer ${secret}`,...(opts.body?{"Content-Type":"application/json"}:{})}});const j=await r.json();if(!r.ok)throw Error(j.error?.message||"Request failed");return j.data}
function display(d){active=d.id;$("record").hidden=false;$("record").innerHTML=`<h2>${esc(d.title)}</h2><p><span class="status">${esc(d.status)}</span> <span class="muted">${esc(d.category)} Â· ${esc(d.created_at)}</span></p><div class="item">${esc(d.message)}</div><h3>Attachments</h3><div>${(d.attachments||[]).map(a=>`<button type="button" data-attachment="${esc(a.attachment_id)}" data-name="${esc(a.original_name)}">Download ${esc(a.original_name)} (${esc(a.size_bytes)} bytes)</button>`).join("")||"<p class=\"muted\">No attachments.</p>"}</div><h3>Conversation</h3><div id="messages">${(d.messages||[]).map(m=>`<article class="item"><b>${esc(m.author_type)}</b><p>${esc(m.body)}</p><span class="muted">${esc(m.created_at)}</span></article>`).join("")||'<p class="muted">No replies yet.</p>'}</div><form id="reply"><label for="body">Send a follow-up</label><textarea id="body" maxlength="4000" required></textarea><button>Send reply</button></form>`;document.querySelectorAll("[data-attachment]").forEach(button=>button.onclick=async()=>{try{const r=await fetch(`/api/v1/customer/feedback/${encodeURIComponent(active)}/attachments/${encodeURIComponent(button.dataset.attachment)}`,{headers:{Authorization:`Bearer ${secret}`},credentials:"omit"});if(!r.ok)throw Error("Attachment is unavailable");const link=document.createElement("a"),blob=await r.blob();link.href=URL.createObjectURL(blob);link.download=button.dataset.name;link.click();URL.revokeObjectURL(link.href)}catch(x){$("status").textContent=x.message}});$("reply").onsubmit=async e=>{e.preventDefault();try{await api(active,"/messages",{method:"POST",body:JSON.stringify({body:$("body").value})});display(await api(active));$("status").textContent="Your reply was sent."}catch(x){$("status").textContent=x.message}}}
$("lookup").onsubmit=async e=>{e.preventDefault();secret=$("token").value.trim();$("status").textContent="Loadingâ€¦";$("record").hidden=true;try{const match=/^(fhcust_[A-Za-z0-9_-]{40,60})$/.exec(secret);if(!match)throw Error("Token format is invalid");const r=await fetch("/api/v1/customer/feedback",{headers:{Authorization:`Bearer ${secret}`},credentials:"omit"});const j=await r.json();if(!r.ok)throw Error(j.error?.message||"Feedback was not found");display(j.data);$("status").textContent=""}catch(x){$("status").textContent=x.message;$("record").hidden=true}};
</script></body></html>
